apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: firecrawl-gateway
  namespace: firecrawl
  labels:
    app: firecrawl
spec:
  gatewayClassName: eg
  listeners:
    # Host-specific listeners: a wildcard :80 listener conflicts with
    # envoy-gateway-system/acme-http01-gateway (cert-manager HTTP-01 solver),
    # which also needs the wildcard :80 tuple and breaks cluster-wide ACME
    # validation when this one wins the conflict.
    - name: http-api
      protocol: HTTP
      port: 80
      hostname: firecrawl-api.prometheusags.ai
      allowedRoutes:
        namespaces:
          from: Same
    - name: http-ui
      protocol: HTTP
      port: 80
      hostname: firecrawl.prometheusags.ai
      allowedRoutes:
        namespaces:
          from: Same
    # Host-specific HTTPS listeners: a wildcard :443 listener with the shared
    # *.prometheusags.ai cert overlaps every per-host listener using the same
    # cert (OverlappingTLSConfig) and breaks SNI chains on those gateways.
    - name: https-ui
      protocol: HTTPS
      port: 443
      hostname: firecrawl.prometheusags.ai
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: prometheusags-wildcard-tls
            namespace: firecrawl
    - name: https-api
      protocol: HTTPS
      port: 443
      hostname: firecrawl-api.prometheusags.ai
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: prometheusags-wildcard-tls
            namespace: firecrawl
